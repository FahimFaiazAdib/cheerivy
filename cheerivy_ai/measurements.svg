<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1060" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#222">CHEERIVY board, seen from ABOVE (like your phone camera)</text>

  <!-- rods -->
  <line x1="190" y1="112" x2="590" y2="112" stroke="#999" stroke-width="5"/>
  <text x="600" y="116" font-size="12" fill="#888">steel rod</text>
  <line x1="190" y1="628" x2="590" y2="628" stroke="#999" stroke-width="5"/>

  <!-- floor + walls -->
  <polygon points="220,120 560,120 560,180 650,280 650,460 560,560 560,620 220,620 220,560 130,460 130,280 220,180"
           fill="#f6f6f2" stroke="#c9b98f" stroke-width="6" stroke-linejoin="round"/>

  <!-- highlighted walls -->
  <line x1="220" y1="120" x2="560" y2="120" stroke="#d62728" stroke-width="8"/>
  <line x1="560" y1="120" x2="560" y2="180" stroke="#ff7f0e" stroke-width="8"/>
  <line x1="220" y1="120" x2="220" y2="180" stroke="#ff7f0e" stroke-width="8"/>

  <!-- AI carriage -->
  <rect x="335" y="120" width="110" height="60" fill="#efe4c8" stroke="#8a7a55" stroke-width="2"/>
  <rect x="345" y="132" width="18" height="36" fill="#222"/>
  <text x="340" y="195" font-size="11" fill="#555">wheel</text>
  <rect x="375" y="133" width="30" height="34" fill="#e0302a"/>
  <text x="408" y="154" font-size="11" fill="#b00">red tape</text>
  <text x="230" y="146" font-size="13" font-weight="bold" fill="#333">AI carriage</text>
  <text x="230" y="162" font-size="13" font-weight="bold" fill="#333">(P2) →</text>

  <!-- P1 carriage -->
  <rect x="335" y="560" width="110" height="60" fill="#efe4c8" stroke="#8a7a55" stroke-width="2"/>
  <rect x="345" y="572" width="18" height="36" fill="#222"/>
  <text x="345" y="648" font-size="13" font-weight="bold" fill="#333">Your carriage (P1)</text>

  <!-- 1 BASE_W -->
  <line x1="222" y1="84" x2="558" y2="84" stroke="#d62728" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="220" y1="78" x2="220" y2="120" stroke="#d62728" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="560" y1="78" x2="560" y2="120" stroke="#d62728" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="390" cy="72" r="13" fill="#d62728"/><text x="390" y="77" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>

  <!-- 2 CARRIAGE_DEPTH -->
  <line x1="470" y1="122" x2="470" y2="178" stroke="#1f77b4" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="445" y1="180" x2="478" y2="180" stroke="#1f77b4" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="492" cy="150" r="13" fill="#1f77b4"/><text x="492" y="155" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>

  <!-- 3 CARRIAGE_W -->
  <line x1="337" y1="212" x2="443" y2="212" stroke="#2ca02c" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="335" y1="180" x2="335" y2="218" stroke="#2ca02c" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="445" y1="180" x2="445" y2="218" stroke="#2ca02c" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="390" cy="232" r="13" fill="#2ca02c"/><text x="390" y="237" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>

  <!-- 4 END_STRAIGHT -->
  <line x1="585" y1="122" x2="585" y2="178" stroke="#ff7f0e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="560" y1="180" x2="592" y2="180" stroke="#ff7f0e" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="608" cy="150" r="13" fill="#ff7f0e"/><text x="608" y="155" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>

  <!-- 5 ball -->
  <circle cx="270" cy="380" r="15" fill="#111"/>
  <line x1="255" y1="408" x2="285" y2="408" stroke="#9467bd" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="270" cy="430" r="13" fill="#9467bd"/><text x="270" y="435" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>

  <!-- already measured (grey) -->
  <line x1="390" y1="182" x2="390" y2="558" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="398" y="400" font-size="13" fill="#888">38 cm ✓</text>
  <text x="398" y="416" font-size="11" fill="#aaa">(you measured)</text>
  <text x="140" y="228" font-size="12" fill="#888">diagonal</text>
  <text x="140" y="243" font-size="12" fill="#888">9 × 10 cm ✓</text>

  <!-- legend -->
  <g font-size="14" fill="#222">
    <text x="690" y="90" font-size="17" font-weight="bold">What to measure (cm)</text>

    <circle cx="703" cy="126" r="11" fill="#d62728"/><text x="703" y="131" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
    <text x="722" y="124" font-weight="bold">BASE_W: top wall length</text>
    <text x="722" y="142" fill="#555">The straight wall behind the AI</text>
    <text x="722" y="158" fill="#555">carriage (red line), inside edge,</text>
    <text x="722" y="174" fill="#555">from corner to corner.</text>

    <circle cx="703" cy="210" r="11" fill="#1f77b4"/><text x="703" y="215" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
    <text x="722" y="208" font-weight="bold">CARRIAGE_DEPTH</text>
    <text x="722" y="226" fill="#555">From that wall to the FRONT face</text>
    <text x="722" y="242" fill="#555">of the carriage (the side that</text>
    <text x="722" y="258" fill="#555">faces the ball / flipper side).</text>

    <circle cx="703" cy="294" r="11" fill="#2ca02c"/><text x="703" y="299" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
    <text x="722" y="292" font-weight="bold">CARRIAGE_W: carriage width</text>
    <text x="722" y="310" fill="#555">Left side to right side of the</text>
    <text x="722" y="326" fill="#555">carriage box (the way it slides).</text>

    <circle cx="703" cy="362" r="11" fill="#ff7f0e"/><text x="703" y="367" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
    <text x="722" y="360" font-weight="bold">END_STRAIGHT</text>
    <text x="722" y="378" fill="#555">The short straight wall piece</text>
    <text x="722" y="394" fill="#555">(orange) between the top wall and</text>
    <text x="722" y="410" fill="#555">where the diagonal starts.</text>
    <text x="722" y="426" fill="#555">If there is none, write 0.</text>

    <circle cx="703" cy="462" r="11" fill="#9467bd"/><text x="703" y="467" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
    <text x="722" y="460" font-weight="bold">Ball diameter</text>
    <text x="722" y="478" fill="#555">Across the ball, widest point.</text>

    <rect x="690" y="510" width="340" height="98" rx="8" fill="#f3f3f3"/>
    <text x="704" y="536" font-weight="bold">Tip</text>
    <text x="704" y="556" fill="#555">Measure on the INSIDE of the walls,</text>
    <text x="704" y="574" fill="#555">where the ball can actually go.</text>
    <text x="704" y="592" fill="#555">±0.5 cm is fine.</text>
  </g>
</svg>
